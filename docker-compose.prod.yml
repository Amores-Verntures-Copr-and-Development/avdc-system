version: "3.8"

services:
  next-app:
    build:
      dockerfile: Dockerfile
      target: production ##development ##production
    container_name: avdc-system
    ports:
      - "3010:3000"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    container_name: ${CONTAINER_DB_NAME}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql_avdc_data:/var/lib/mysql

volumes:
  mysql_avdc_data:
